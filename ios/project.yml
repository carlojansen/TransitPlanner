name: TransitPlanner
options:
  bundleIdPrefix: de.carlojansen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  TransitCore:
    path: TransitCore
targets:
  TransitPlanner:
    type: application
    platform: iOS
    sources:
      - path: TransitPlanner
    dependencies:
      - package: TransitCore
    info:
      path: TransitPlanner/Info.plist
      properties:
        CFBundleDisplayName: TransitPlanner
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Dein Standort wird nur auf dem Gerät verwendet, um Haltestellen in der Nähe und Fußwege zu berechnen. Ans Fahrplan-Backend geht nur eine gerundete Koordinate."
        # ATS: Standard (kein NSAllowsArbitraryLoads). TLS 1.3 und Pinning erzwingt TransitCore.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlojansen.transitplanner
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  TransitPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TransitPlannerTests
    dependencies:
      - target: TransitPlanner
      - package: TransitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlojansen.transitplanner.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TransitPlanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TransitPlanner
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  TransitPlanner:
    build:
      targets:
        TransitPlanner: all
    test:
      targets:
        - package: TransitCore/TransitCoreTests
        - TransitPlannerTests
  # Release-Sperre: aktiviert den Test, der ohne zweiten SPKI-Pin fehlschlaegt (erwarteter Blocker).
  TransitPlanner-ReleaseGate:
    build:
      targets:
        TransitPlanner: all
        TransitPlannerTests: [test]
    test:
      config: Release
      environmentVariables:
        TRANSITPLANNER_RELEASE_GATE: "1"
      targets:
        - TransitPlannerTests
