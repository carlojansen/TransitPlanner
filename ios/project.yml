name: TransitPlanner
options:
  bundleIdPrefix: de.carlojansen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 2L3NSWH76D
packages:
  TransitCore:
    path: TransitCore
targets:
  TransitPlanner:
    type: application
    platform: iOS
    sources:
      - path: TransitPlanner
      - path: Shared
    dependencies:
      - package: TransitCore
      - target: TransitPlannerWidgets
    entitlements:
      path: TransitPlanner/TransitPlanner.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        # Geteilter Container nur fuer den Snapshot (`TripSnapshotFile.appGroup`).
        com.apple.security.application-groups: [group.de.carlojansen.transitplanner]
    info:
      path: TransitPlanner/Info.plist
      properties:
        CFBundleDisplayName: TransitPlanner
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Dein Standort wird nur auf dem Gerät verwendet, um Haltestellen in der Nähe und Fußwege zu berechnen, während einer Fahrt auch im Hintergrund. Ans Fahrplan-Backend geht nur eine gerundete Koordinate."
        # Neuberechnung der Erinnerungen ca. 30 Min. vor dem Losgehen (BGAppRefreshTask, ReminderCenter.backgroundTaskID).
        # location: Navigation bei gesperrtem Geraet, nur mit CLBackgroundActivitySession ab der Gehphase.
        UIBackgroundModes: [fetch, location]
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [de.carlojansen.transitplanner.reminder-refresh]
        # ATS: Standard (kein NSAllowsArbitraryLoads). TLS 1.3 und Pinning erzwingt TransitCore.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlojansen.transitplanner
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App-Icon: TransitPlanner/AppIcon.icon (Icon Composer, Tram-Symbol auf Glas-Pin, zwei Ebenen)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  # Liest nur den Snapshot aus der App Group, kein Netz. Versionen wie die App.
  TransitPlannerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TransitPlannerWidgets
      - path: Shared
      # Dieselben Farb-Tokens und Modus-Symbole wie die App.
      - path: TransitPlanner/Theme.swift
      - path: TransitPlanner/Assets.xcassets
    dependencies:
      - package: TransitCore
    entitlements:
      path: TransitPlannerWidgets/TransitPlannerWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.de.carlojansen.transitplanner]
    info:
      path: TransitPlannerWidgets/Info.plist
      properties:
        CFBundleDisplayName: TransitPlanner
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlojansen.transitplanner.widgets
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  TransitPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TransitPlannerTests
    dependencies:
      - target: TransitPlanner
      - package: TransitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlojansen.transitplanner.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TransitPlanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TransitPlanner
        BUNDLE_LOADER: $(TEST_HOST)
  TransitPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TransitPlannerUITests
    dependencies:
      - target: TransitPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.carlojansen.transitplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TransitPlanner
schemes:
  TransitPlanner:
    build:
      targets:
        TransitPlanner: all
    # Metal-API-Validierung aus: MapKit-Polylines unter Liquid Glass loesen im Debugger eine
    # Framework-Assertion aus (MTLStoreActionMultisampleResolve ohne Resolve-Textur), kein App-Code betroffen.
    run:
      enableGPUValidationMode: disabled
    test:
      targets:
        - package: TransitCore/TransitCoreTests
        - TransitPlannerTests
        - TransitPlannerUITests
  # Release-Sperre: aktiviert den Test, der ohne zweiten SPKI-Pin fehlschlaegt (erwarteter Blocker).
  TransitPlanner-ReleaseGate:
    build:
      targets:
        TransitPlanner: all
        TransitPlannerTests: [test]
    test:
      config: Release
      environmentVariables:
        TRANSITPLANNER_RELEASE_GATE: "1"
      targets:
        - TransitPlannerTests
